name = "portfolio-carolina"
main = "./worker.ts"
compatibility_date = "2026-09-21"
keep_vars = true

[build]
command = "npm run build"

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = [ "/api/stripe/webhook", "/api/stripe/webhook/", "/api/editorial/status", "/api/editorial/status/", "/api/editorial/generate", "/api/editorial/generate/", "/api/editorial/image", "/api/editorial/image/" ]

[secrets]
required = [ "STRIPE_WEBHOOK_SECRET" ]

# Stripe webhook and private Instagram AI routes run in the Worker; all other requests are static assets.
# Set OPENAI_API_KEY as a Cloudflare secret to enable automatic generation.
# keep_vars preserves dashboard-managed variables and secrets across Wrangler deploys.
# secrets.required makes deploy fail clearly if the runtime secret is missing.
