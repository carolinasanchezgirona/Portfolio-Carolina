plugins { id 'com.android.application' }
android {
    namespace 'com.carolinasanchezgirona.miclinica'
    compileSdk 35
    defaultConfig {
        applicationId 'com.carolinasanchezgirona.miclinica'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('MICLINICA_KEYSTORE')) {
                storeFile file(System.getenv('MICLINICA_KEYSTORE'))
                storePassword System.getenv('MICLINICA_STORE_PASSWORD')
                keyAlias 'miclinica'
                keyPassword System.getenv('MICLINICA_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
