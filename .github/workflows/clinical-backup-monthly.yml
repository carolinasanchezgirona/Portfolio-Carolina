name: Copia clínica mensual

on:
  workflow_dispatch:

jobs:
  test-r2:
    runs-on: ubuntu-24.04

    steps:
      - name: Instalar rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Comprobar acceso al bucket de Cloudflare R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.CLINICAL_BACKUP_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.CLINICAL_BACKUP_R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.CLINICAL_BACKUP_R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: private
          R2_MONTHLY_PATH: ${{ vars.CLINICAL_BACKUP_R2_MONTHLY_PATH }}
        run: |
          echo "Comprobando acceso al bucket clínico de Cloudflare R2..."

          rclone lsf "r2:${R2_MONTHLY_PATH}" --max-depth 1

          echo "Acceso al bucket clínico de Cloudflare R2 correcto."
