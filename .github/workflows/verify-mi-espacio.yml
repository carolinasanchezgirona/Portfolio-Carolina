name: Validar Mi espacio
on:
  push:
    branches: [feature/mi-espacio-enlace-seguro]
  pull_request:
    paths:
      - 'app/mi-espacio/**'
      - 'public/mi-espacio.js'
      - 'worker.ts'
      - 'supabase/functions/patient-portal-auth/**'
      - 'package*.json'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check public/mi-espacio.js
      - run: node --experimental-strip-types --test tests/clinical-privacy.test.mjs tests/patient-portal-auth.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/patient-portal-auth/index.ts
      - run: npx tsc --noEmit
      - run: npm run build
