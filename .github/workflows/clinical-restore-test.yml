name: Prueba restauración clínica

on:
  workflow_dispatch:

jobs:
  restore-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone openssl tar
          rclone version
          openssl version
          tar --version

      - name: Descargar última copia desde Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_TOKEN }}
          GOOGLE_DRIVE_BACKUP_PATH: ${{ vars.CLINICAL_BACKUP_GOOGLE_DRIVE_PATH }}
        run: |
          mkdir -p restore

          LATEST=$(rclone lsf \
            "gdrive:${GOOGLE_DRIVE_BACKUP_PATH}" \
            --files-only \
            --include "dememoria-*.tar.gz.enc" \
            | sort \
            | tail -n 1)

          test -n "$LATEST"

          echo "Copia seleccionada: $LATEST"

          rclone copyto \
            "gdrive:${GOOGLE_DRIVE_BACKUP_PATH}/${LATEST}" \
            "restore/${LATEST}"

          test -s "restore/${LATEST}"

      - name: Descifrar copia
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          FILE=$(find restore -name 'dememoria-*.tar.gz.enc' -type f | head -n 1)
          test -n "$FILE"

          OUT="${FILE%.enc}"

          openssl enc -d -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -in "$FILE" \
            -out "$OUT" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD

          test -s "$OUT"

          echo "Descifrado correcto."

      - name: Abrir paquete
        run: |
          FILE=$(find restore -name 'dememoria-*.tar.gz' -type f | head -n 1)
          test -n "$FILE"

          mkdir -p restore/unpacked

          tar -xzf "$FILE" -C restore/unpacked

          echo "Paquete abierto correctamente."

      - name: Verificar base de datos
        run: |
          test -s restore/unpacked/backup/database/supabase-db.dump

          echo "Base de datos presente."

      - name: Verificar Supabase Storage
        run: |
          test -d restore/unpacked/backup/storage/article-images
          test -d restore/unpacked/backup/storage/clinical-documents

          echo "Buckets de Storage presentes."

      - name: Mostrar resumen
        run: |
          echo "Contenido restaurable:"
          find restore/unpacked/backup -maxdepth 3 -type f | sort

          echo ""
          echo "PRUEBA DE RESTAURACIÓN COMPLETADA CORRECTAMENTE."
