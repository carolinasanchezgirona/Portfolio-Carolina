name: Publicar carolinasanchezgirona.com en Cloudflare

on:
  workflow_dispatch:
  # Publicación automática solo tras la compilación íntegra y satisfactoria de main.
  workflow_run:
    workflows: ["Comprobar compilación web"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production-portfolio-carolina
  cancel-in-progress: false

jobs:
  release:
    name: Compilar, publicar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    steps:
      - name: Descargar exactamente la revisión que superó las pruebas
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Comprobar credenciales de Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configura CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID como secretos del repositorio. Nunca publiques sus valores en los registros."
            exit 1
          fi

      - name: Verificar destino único y configuración Worker
        shell: bash
        run: |
          grep -qx 'name = "portfolio-carolina"' wrangler.toml
          grep -q '^keep_vars = true$' wrangler.toml
          grep -qx 'main = "./worker.ts"' wrangler.toml
          grep -q 'directory = "./out"' wrangler.toml

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar funcionalidades sensibles
        run: |
          node --check public/admin-economia.js
          node --check public/admin-agenda-view-switcher.js
          node --check public/admin-notifications.js
          node --test tests/billing-invoices.test.mjs tests/patient-shared-files.test.mjs tests/clinical-file-notifications.test.mjs tests/admin-agenda-notifications.test.mjs

      - name: Compilar proyecto completo
        run: npm run build

      - name: Confirmar exportación de pantallas privadas
        run: |
          test -f out/admin/economia/index.html
          test -f out/admin/clinica/index.html
          test -f out/admin/agenda/index.html
          test -f out/admin/notificaciones/index.html
          test -f out/mi-espacio/index.html
          test -f out/admin-economia.js
          test -f out/admin-notifications.js
          test -f out/admin-agenda-view-switcher.js

      - name: Publicar Worker y archivos estáticos en Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verificar página pública nueva, sin iniciar sesión
        shell: bash
        run: |
          set -euo pipefail
          url="https://carolinasanchezgirona.com/admin/economia/"
          ok=0
          for i in 1 2 3 4 5 6; do
            status=$(curl -sS --max-time 20 --output /tmp/dememoria-economia.html --write-out '%{http_code}' \
              "$url?deploy_check=$GITHUB_SHA" || true)
            if [ "$status" = "200" ] && grep -q "Gestión económica" /tmp/dememoria-economia.html; then
              ok=1
              break
            fi
            sleep 8
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Cloudflare aceptó el despliegue, pero no se confirma /admin/economia/ en el dominio principal. Comprueba la asignación de dominio/ruta al Worker portfolio-carolina."
            exit 1
          fi
          echo "Contabilidad confirmada. Comprobando Agenda y avisos..."
          ok=0
          for i in 1 2 3 4 5 6; do
            agenda_status=$(curl -sS --max-time 20 -o /tmp/dememoria-agenda.html -w '%{http_code}' \
              "https://carolinasanchezgirona.com/admin/agenda/?deploy_check=$GITHUB_SHA" || true)
            avisos_status=$(curl -sS --max-time 20 -o /tmp/dememoria-avisos.html -w '%{http_code}' \
              "https://carolinasanchezgirona.com/admin/notificaciones/?deploy_check=$GITHUB_SHA" || true)
            if [ "$agenda_status" = "200" ] && [ "$avisos_status" = "200" ] \
               && grep -q 'admin-agenda-view-select' /tmp/dememoria-agenda.html \
               && grep -q 'Centro de avisos' /tmp/dememoria-avisos.html; then
              ok=1
              break
            fi
            sleep 8
          done
          if [ "$ok" != "1" ]; then
            echo "::error::No se han podido confirmar Agenda simplificada y Centro de avisos en el dominio."
            exit 1
          fi
          echo "Publicación verificada en Agenda, Centro de avisos y Gestión económica. Las operaciones privadas requieren comprobación con cuenta de prueba."
