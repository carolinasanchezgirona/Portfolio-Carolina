name: Copia clínica simple

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Exportar base de datos de Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file=backup/supabase-db.dump

      - name: Comprobar que la exportación existe
        run: |
          test -s backup/supabase-db.dump
          echo "Exportación de Supabase creada correctamente."
          ls -lh backup/supabase-db.dump
