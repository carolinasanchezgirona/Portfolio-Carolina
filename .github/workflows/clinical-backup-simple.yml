name: Copia clínica simple

on:
  workflow_dispatch:

  schedule:
    - cron: "17 1 * * *"
    - cron: "17 2 * * *"

jobs:
  backup:
    runs-on: ubuntu-24.04

    steps:
      - name: Comprobar hora local
        id: horario
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(TZ=Europe/Madrid date +%H)" != "03" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No corresponde ejecutar la copia en este disparo."
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Instalar PostgreSQL 17 y herramientas
        if: steps.horario.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates openssl rclone tar curl

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo wget -qO /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          /usr/lib/postgresql/17/bin/pg_dump --version
          rclone version
          openssl version
          tar --version

      - name: Preparar estructura de copia
        if: steps.horario.outputs.should_run == 'true'
        run: |
          mkdir -p backup/database
          mkdir -p backup/storage/article-images
          mkdir -p backup/storage/clinical-documents

          echo "Estructura temporal preparada."

      - name: Exportar base de datos de Supabase
        if: steps.horario.outputs.should_run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file=backup/database/supabase-db.dump

          test -s backup/database/supabase-db.dump

          echo "Base de datos exportada correctamente."
          ls -lh backup/database/supabase-db.dump

      - name: Descargar Supabase Storage
        if: steps.horario.outputs.should_run == 'true'
        env:
          RCLONE_CONFIG_SUPABASESOURCE_TYPE: s3
          RCLONE_CONFIG_SUPABASESOURCE_PROVIDER: Other
          RCLONE_CONFIG_SUPABASESOURCE_ACCESS_KEY_ID: ${{ secrets.CLINICAL_BACKUP_SUPABASE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SUPABASESOURCE_SECRET_ACCESS_KEY: ${{ secrets.CLINICAL_BACKUP_SUPABASE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_SUPABASESOURCE_ENDPOINT: https://grgyvdxkjdstdyumdfyg.storage.supabase.co/storage/v1/s3
          RCLONE_CONFIG_SUPABASESOURCE_REGION: ${{ vars.CLINICAL_BACKUP_SUPABASE_S3_REGION }}
          RCLONE_CONFIG_SUPABASESOURCE_FORCE_PATH_STYLE: "true"
        run: |
          echo "Descargando bucket article-images..."

          rclone copy \
            "supabasesource:article-images" \
            "backup/storage/article-images"

          echo "Descargando bucket clinical-documents..."

          rclone copy \
            "supabasesource:clinical-documents" \
            "backup/storage/clinical-documents"

          echo "Supabase Storage descargado correctamente."

      - name: Comprobar contenido del backup
        if: steps.horario.outputs.should_run == 'true'
        run: |
          test -s backup/database/supabase-db.dump
          test -d backup/storage/article-images
          test -d backup/storage/clinical-documents

          echo "Estructura del backup:"
          find backup -maxdepth 4 -print | sort

      - name: Crear paquete único
        if: steps.horario.outputs.should_run == 'true'
        run: |
          DATE=$(TZ=Europe/Madrid date +%F)

          tar -czf "dememoria-${DATE}.tar.gz" backup

          test -s "dememoria-${DATE}.tar.gz"

          echo "Paquete creado correctamente."
          ls -lh "dememoria-${DATE}.tar.gz"

      - name: Cifrar paquete
        if: steps.horario.outputs.should_run == 'true'
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          DATE=$(TZ=Europe/Madrid date +%F)

          openssl enc -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 200000 \
            -in "dememoria-${DATE}.tar.gz" \
            -out "dememoria-${DATE}.tar.gz.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD

          test -s "dememoria-${DATE}.tar.gz.enc"

          echo "Paquete cifrado correctamente."
          ls -lh "dememoria-${DATE}.tar.gz.enc"

      - name: Eliminar contenido sin cifrar
        if: steps.horario.outputs.should_run == 'true'
        run: |
          rm -rf backup
          rm -f dememoria-*.tar.gz

          test ! -d backup

          echo "Contenido sin cifrar eliminado."

      - name: Subir copia cifrada a Google Drive
        if: steps.horario.outputs.should_run == 'true'
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_TOKEN }}
          GOOGLE_DRIVE_BACKUP_PATH: ${{ vars.CLINICAL_BACKUP_GOOGLE_DRIVE_PATH }}
        run: |
          FILE=$(find . -maxdepth 1 -name 'dememoria-*.tar.gz.enc' -type f | head -n 1)
          test -n "$FILE"

          NAME=$(basename "$FILE")

          rclone copyto \
            "$FILE" \
            "gdrive:${GOOGLE_DRIVE_BACKUP_PATH}/${NAME}"

          echo "Copia completa subida a Google Drive: $NAME"

      - name: Verificar copia en Google Drive
        if: steps.horario.outputs.should_run == 'true'
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_TOKEN }}
          GOOGLE_DRIVE_BACKUP_PATH: ${{ vars.CLINICAL_BACKUP_GOOGLE_DRIVE_PATH }}
        run: |
          FILE=$(find . -maxdepth 1 -name 'dememoria-*.tar.gz.enc' -type f | head -n 1)
          test -n "$FILE"

          NAME=$(basename "$FILE")

          rclone lsf "gdrive:${GOOGLE_DRIVE_BACKUP_PATH}" | grep -Fx "$NAME"

          echo "Copia confirmada en Google Drive: $NAME"

      - name: Eliminar copias de Google Drive de más de 30 días
        if: steps.horario.outputs.should_run == 'true'
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_TOKEN }}
          GOOGLE_DRIVE_BACKUP_PATH: ${{ vars.CLINICAL_BACKUP_GOOGLE_DRIVE_PATH }}
        run: |
          rclone delete \
            "gdrive:${GOOGLE_DRIVE_BACKUP_PATH}" \
            --min-age 30d \
            --include "dememoria-*.tar.gz.enc"

          echo "Retención de 30 días aplicada correctamente."

      - name: Avisar por Telegram si la copia diaria termina correctamente
        if: ${{ success() && steps.horario.outputs.should_run == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CLINICAL_BACKUP_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CLINICAL_BACKUP_TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="✅ Copia clínica diaria completada correctamente.

          Fecha: $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')
          Destino: Google Drive
          Contenido: base de datos + Storage
          Estado: copia verificada correctamente."

          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

          echo "Notificación de éxito enviada por Telegram."

      - name: Avisar por Telegram si falla la copia diaria
        if: ${{ failure() && steps.horario.outputs.should_run == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CLINICAL_BACKUP_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CLINICAL_BACKUP_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="❌ Ha fallado la copia clínica diaria de Dememoria.

          Fecha: $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')
          Destino previsto: Google Drive

          Revisa la ejecución:
          ${RUN_URL}"

          curl --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            || echo "No se pudo enviar la notificación de Telegram."
