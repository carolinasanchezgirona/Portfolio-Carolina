name: Copia clínica simple

on:
  workflow_dispatch:

  schedule:
    - cron: "17 1 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar PostgreSQL 17 y herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates openssl rclone
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget -qO /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          openssl version
          rclone version

      - name: Exportar base de datos de Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file=backup/supabase-db.dump

      - name: Comprobar exportación
        run: |
          test -s backup/supabase-db.dump
          echo "Exportación de Supabase creada correctamente."
          ls -lh backup/supabase-db.dump

      - name: Cifrar copia
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          DATE=$(date +%F)

          openssl enc -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 200000 \
            -in backup/supabase-db.dump \
            -out "backup/dememoria-${DATE}.dump.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD

      - name: Comprobar archivo cifrado
        run: |
          FILE=$(find backup -name 'dememoria-*.dump.enc' -type f | head -n 1)
          test -n "$FILE"
          test -s "$FILE"

          echo "Copia cifrada creada correctamente."
          ls -lh "$FILE"

      - name: Eliminar copia sin cifrar
        run: |
          rm -f backup/supabase-db.dump
          test ! -f backup/supabase-db.dump
          echo "Archivo sin cifrar eliminado."

      - name: Subir copia cifrada a Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_TOKEN }}
          GOOGLE_DRIVE_BACKUP_PATH: ${{ vars.CLINICAL_BACKUP_GOOGLE_DRIVE_PATH }}
        run: |
          FILE=$(find backup -name 'dememoria-*.dump.enc' -type f | head -n 1)
          NAME=$(basename "$FILE")

          rclone copyto \
            "$FILE" \
            "gdrive:${GOOGLE_DRIVE_BACKUP_PATH}/${NAME}"

          echo "Archivo enviado a Google Drive."

      - name: Verificar copia en Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_TOKEN }}
          GOOGLE_DRIVE_BACKUP_PATH: ${{ vars.CLINICAL_BACKUP_GOOGLE_DRIVE_PATH }}
        run: |
          FILE=$(find backup -name 'dememoria-*.dump.enc' -type f | head -n 1)
          NAME=$(basename "$FILE")

          rclone lsf "gdrive:${GOOGLE_DRIVE_BACKUP_PATH}" | grep -Fx "$NAME"

          echo "Copia confirmada en Google Drive: $NAME"
      - name: Eliminar copias de Google Drive de más de 30 días
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.CLINICAL_BACKUP_GOOGLE_DRIVE_TOKEN }}
          GOOGLE_DRIVE_BACKUP_PATH: ${{ vars.CLINICAL_BACKUP_GOOGLE_DRIVE_PATH }}
        run: |
          rclone delete \
            "gdrive:${GOOGLE_DRIVE_BACKUP_PATH}" \
            --min-age 30d \
            --include "dememoria-*.dump.enc"

          echo "Retención de 30 días aplicada correctamente."
