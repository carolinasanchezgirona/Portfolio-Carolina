name: Prueba aviso backup

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Enviar mensaje de prueba
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CLINICAL_BACKUP_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CLINICAL_BACKUP_TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="✅ Prueba de aviso de copias de Dememoria correcta."

          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

          echo "Mensaje de prueba enviado."
