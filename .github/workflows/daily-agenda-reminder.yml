name: Aviso diario de agenda

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"

jobs:
  agenda-reminder:
    runs-on: ubuntu-24.04

    steps:
      - name: Comprobar horario de verano/invierno
        id: horario
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET="$(TZ=Europe/Madrid date +%z)"
          SCHEDULE="${{ github.event.schedule }}"

          if [[ "$OFFSET" == "+0200" && "$SCHEDULE" == "0 17 * * *" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Horario de verano: corresponde enviar el aviso."
          elif [[ "$OFFSET" == "+0100" && "$SCHEDULE" == "0 18 * * *" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Horario de invierno: corresponde enviar el aviso."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Disparo secundario omitido para evitar duplicados."
          fi

      - name: Instalar cliente PostgreSQL
        if: steps.horario.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl

      - name: Preparar resumen de mañana
        if: steps.horario.outputs.should_run == 'true'
        id: resumen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "Falta el secret SUPABASE_DB_URL."
            exit 1
          fi

          TOMORROW="$(TZ=Europe/Madrid date -d tomorrow +%F)"

          QUERY=$(cat <<'SQL'
          with tomorrow_appointments as (
            select
              starts_at,
              patient_type,
              service_code,
              status
            from public.appointment_bookings
            where (starts_at at time zone 'Europe/Madrid')::date =
                  ((now() at time zone 'Europe/Madrid')::date + 1)
              and status in ('confirmed', 'pending')
          )
          select
            to_char(starts_at at time zone 'Europe/Madrid', 'HH24:MI')
            || ' · '
            || case
                 when patient_type = 'new' then 'Primera visita'
                 else 'Paciente existente'
               end
            || ' · '
            || case
                 when service_code = 'neuropsicologia' then 'Neuropsicología'
                 else 'Psicología'
               end
            || case
                 when status = 'pending' then ' · Pendiente'
                 else ''
               end
          from tomorrow_appointments
          order by starts_at;
          SQL
          )

          mapfile -t APPOINTMENTS < <(
            psql "$SUPABASE_DB_URL" --no-align --tuples-only --quiet --command "$QUERY" |
              sed '/^[[:space:]]*$/d'
          )

          COUNT=${#APPOINTMENTS[@]}

          if [[ "$COUNT" -eq 0 ]]; then
            printf -v MESSAGE '📅 Agenda de mañana · %s\n\nNo tienes citas programadas para mañana.\n\nResumen enviado automáticamente a las 19:00.' "$TOMORROW"
          else
            LIST=""
            for ITEM in "${APPOINTMENTS[@]}"; do
              LIST+="\n• ${ITEM}"
            done

            if [[ "$COUNT" -eq 1 ]]; then
              LABEL="Tienes 1 cita programada:"
            else
              LABEL="Tienes ${COUNT} citas programadas:"
            fi

            printf -v MESSAGE '📅 Agenda de mañana · %s\n\n%s%b\n\nResumen enviado automáticamente a las 19:00.' "$TOMORROW" "$LABEL" "$LIST"
          fi

          {
            echo "message<<EOF"
            printf '%s\n' "$MESSAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Enviar aviso por Telegram
        if: steps.horario.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CLINICAL_BACKUP_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CLINICAL_BACKUP_TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ steps.resumen.outputs.message }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Faltan las credenciales de Telegram."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

          echo "Aviso de agenda enviado correctamente."
