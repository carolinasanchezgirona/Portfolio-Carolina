name: Comprobar compilación web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js export
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Probar bloqueo de identificadores en la IA clínica
        run: |
          node --check public/mi-espacio.js
          node --experimental-strip-types --test tests/clinical-privacy.test.mjs tests/patient-portal-auth.test.mjs

      - name: Compilar y exportar web
        run: npm run build

      - name: Verificar salida estática
        run: |
          test -d out
          test -f out/index.html
          test -f out/_headers
          grep -q 'run_worker_first = \[ "/api/\*" \]' wrangler.toml
          echo "Compilación y configuración de seguridad correctas: ./out generado"
