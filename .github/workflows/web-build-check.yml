name: Comprobar compilación web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js export
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Probar bloqueo de identificadores en la IA clínica
        run: node --experimental-strip-types --test tests/clinical-privacy.test.mjs

      - name: Configurar Deno para validar la función de PDF
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Comprobar TypeScript de la función neuropsicológica
        run: deno check --node-modules-dir=auto supabase/functions/view-clinical-exercise/index.ts

      - name: Validar recursos visuales neuropsicológicos y editor
        run: |
          node --check public/clinic-neuro-materials.js
          node --experimental-strip-types --test tests/clinical-neuro-visual.test.mjs tests/clinical-neuro-library.test.mjs tests/clinical-neuro-weekly.test.mjs

      - name: Validar editor clínico, guardado automático y navegación
        run: |
          node --check public/admin-clinica.js
          node --check public/clinic-report-options.js
          node --check public/admin-shell.js
          node --check public/clinic-pwa.js
          node --test tests/clinic-admin-workspace.test.mjs tests/clinic-navigation.test.mjs

      - name: Validar ficha clínica única y preparación de sesiones
        run: |
          node --check public/clinic-patient-workspace.js
          node --check public/admin-clinica.js
          node --check public/clinic-patient-dashboard.js
          node --check public/clinic-goals-manager.js
          node --check public/clinic-admin-tasks.js
          node --check public/clinic-scale-trends.js
          node --test tests/clinic-unified-patient.test.mjs

      - name: Verificar notificaciones seguras de documentos
        run: |
          deno check supabase/functions/notify-clinical-file/index.ts
          node --check public/admin-clinica.js
          node --test tests/clinical-file-notifications.test.mjs

      - name: Verificar facturación privada y generación de facturas
        run: |
          node --check public/admin-economia.js
          node --test tests/billing-invoices.test.mjs
          node --experimental-strip-types --test tests/billing-import.test.mjs

      - name: Validar documentos, audios y control de acceso de pacientes
        run: |
          node --check public/admin-clinica.js
          node --check public/mi-espacio.js
          node --test tests/patient-shared-files.test.mjs

      - name: Validar Word clínico, protección y controles
        run: node --test tests/clinic-word-export.test.mjs

      - name: Validar láminas 3D de Mi espacio
        run: node --test tests/mi-espacio-art.test.mjs

      - name: Prevenir duplicados de registros y solapamiento móvil
        run: node --test tests/mi-espacio-mood-mobile.test.mjs

      - name: Validar escala emocional intuitiva
        run: node --test tests/mi-espacio-mood-scale.test.mjs

      - name: Validar baterías de energía y personaje integrado
        run: node --test tests/mi-espacio-energy-batteries.test.mjs

      - name: Validar expresiones del personaje elegido
        run: node --test tests/mi-espacio-avatar-expressions.test.mjs

      - name: Validar pantallas de Mi espacio
        run: |
          node --check public/mi-espacio.js
          node --check public/mi-espacio-prueba.js
          grep -q 'id="space-login-form"' app/mi-espacio/page.tsx
          grep -q '/mi-espacio/?vista=panel' public/mi-espacio.js
          ! grep -q 'id="space-code-form"' app/mi-espacio/page.tsx

      - name: Verificar acceso a videoconsulta de prueba
        run: node --experimental-strip-types --test tests/daily-test.test.mjs tests/appointment-video.test.mjs

      - name: Compilar y exportar web
        run: npm run build

      - name: Verificar salida estática
        run: |
          test -d out
          test -f out/index.html
          test -f out/_headers
          python3 -c 'import tomllib; c=tomllib.load(open("wrangler.toml","rb")); assert "/api/*" in c["assets"]["run_worker_first"]; assert "/admin/videoconsulta/prueba/" in c["assets"]["run_worker_first"]'
          echo "Compilación y configuración de seguridad correctas: ./out generado"

  comprobar-autenticacion:
    name: Sonda negativa autenticación pacientes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar que backend rechaza credenciales sin revelar datos
        shell: bash
        run: |
          status=$(curl --silent --show-error --max-time 20 \
            --output /tmp/patient-auth-test-response.json --write-out '%{http_code}' \
            -X POST 'https://carolinasanchezgirona.com/api/patient-portal/password-login' \
            -H 'Origin: https://carolinasanchezgirona.com' \
            -H 'Content-Type: application/json' \
            --data '{"email":"sonda-sin-paciente-20261008@example.org","password":"invalid-test-password"}') || status=000
          body=$(cat /tmp/patient-auth-test-response.json 2>/dev/null || echo '{}')
          echo "Estado HTTP de autenticación: ${status}"
          if [ "$status" = "401" ] && [[ "$body" == *"Correo o contraseña incorrectos."* ]]; then
            echo "Prueba superada: contraseña incorrecta rechazada por Supabase Auth."
          elif [[ "$body" == *"Acceso no autorizado."* ]]; then
            echo "::error::Secreto de Cloudflare no coincide con la credencial de Supabase del proyecto portal-pacientes."
            exit 1
          else
            echo "::error::Fallo de configuración o de respuesta: estado ${status}."
            exit 1
          fi

      - name: Verificar solicitud de invitación sin enviar correo real
        shell: bash
        run: |
          status=$(curl --silent --show-error --max-time 20 \
            --output /tmp/patient-invite-test-response.json --write-out '%{http_code}' \
            -X POST 'https://carolinasanchezgirona.com/api/patient-portal/password-link' \
            -H 'Origin: https://carolinasanchezgirona.com' \
            -H 'Content-Type: application/json' \
            --data '{"email":"sonda-sin-paciente-20261008@example.org","purpose":"setup"}') || status=000
          body=$(cat /tmp/patient-invite-test-response.json 2>/dev/null || echo '{}')
          echo "Estado HTTP de solicitud de invitación: ${status}"
          if [ "$status" = "200" ] && [[ "$body" == *'"ok":true'* ]]; then
            echo "Prueba superada: invitación procesada sin exponer existencia de cuenta."
          else
            echo "::error::Solicitud de invitación fallida: estado ${status}."
            exit 1
          fi

