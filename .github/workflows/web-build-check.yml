name: Comprobar compilación web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js export
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Probar bloqueo de identificadores en la IA clínica
        run: node --experimental-strip-types --test tests/clinical-privacy.test.mjs

      - name: Validar pantallas de Mi espacio
        run: |
          node --check public/mi-espacio.js
          node --check public/mi-espacio-prueba.js
          grep -q 'id="space-login-form"' app/mi-espacio/page.tsx
          grep -q '/mi-espacio/?vista=panel' public/mi-espacio.js
          ! grep -q 'id="space-code-form"' app/mi-espacio/page.tsx

      - name: Compilar y exportar web
        run: npm run build

      - name: Verificar salida estática
        run: |
          test -d out
          test -f out/index.html
          test -f out/_headers
          grep -q 'run_worker_first = \[ "/api/\*" \]' wrangler.toml
          echo "Compilación y configuración de seguridad correctas: ./out generado"

  comprobar-autenticacion:
    name: Sonda negativa autenticación pacientes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar que backend rechaza credenciales sin revelar datos
        shell: bash
        run: |
          status=$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            -X POST 'https://carolinasanchezgirona.com/api/patient-portal/password-login' \
            -H 'Origin: https://carolinasanchezgirona.com' \
            -H 'Content-Type: application/json' \
            --data '{"email":"sonda-sin-paciente-20261008@example.org","password":"invalid-test-password"}') || status=000
          echo "Estado de rechazo de credenciales inválidas: ${status}"
          if [ "$status" = "401" ]; then
            echo "Backend accesible y credenciales rechazadas correctamente."
          elif [ "$status" = "503" ]; then
            echo "::warning::Backend no configurado; verificar SUPABASE_SERVICE_ROLE_KEY en Cloudflare Workers (producción)."
          else
            echo "::warning::Código inesperado ${status}; revisar en Cloudflare Workers Logs."
          fi
